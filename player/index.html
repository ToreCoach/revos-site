<!doctype html>
<html translate="no" lang="it">
<meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REVOS Player</title>
<meta name="theme-color" content="#050F1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REVOS Player">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: a sinistra il telefono del giocatore, a destra l'area coach di REVOS Analyst. Un'assegnazione a destra compare subito a sinistra. */
:root {
  --bg: #050F1F; --bg2: #08162e; --panel: #0b1d3a; --panel2: #102a50; --line: rgba(120, 190, 255, 0.16);
  --fg: #eef3ff; --muted: #94a3c8; --lime: #8bfc03; --lime-d: #5ecb00; --on-lime: #04220f; --cy: #22d3ee;
  --red: #ff5a6a; --blue: #5aa9ff; --gold: #ffc940; --ok: #3ddc84;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif; --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; border-radius: 6px; }
.disp { font-family: var(--f-disp); text-transform: uppercase; letter-spacing: 0.02em; }

.top { max-width: 1180px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.top .brand { display: flex; align-items: center; gap: 12px; }
.top .brand img { width: 38px; height: 38px; border-radius: 9px; }
.top h1 { font-family: var(--f-disp); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
.top h1 span { color: var(--lime); }
.top .proto { color: var(--muted); font-size: 14px; }
.mobtabs { display: none; max-width: 1180px; margin: 0 auto 16px; gap: 8px; }
.mobtabs button { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); font-weight: 600; }
.mobtabs button[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); border-color: transparent; }

.stage { display: grid; grid-template-columns: 392px minmax(0, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; align-items: start; }
.cap { color: var(--muted); font-size: 14px; margin-top: 12px; max-width: 392px; }
@media (max-width: 940px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .mobtabs { display: flex; }
  body.v-player .coachcol, body.v-coach .playercol { display: none; }
  .playercol { display: flex; flex-direction: column; align-items: center; }
}

/* telefono */
.phone { position: relative; width: 100%; max-width: 392px; height: clamp(600px, 84vh, 790px); display: flex; flex-direction: column; background: var(--bg); border: 1px solid rgba(160, 210, 255, 0.28); border-radius: 36px; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.85), 0 0 0 6px #0a1428, 0 0 0 7px rgba(160, 210, 255, 0.14); }
.screen { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 18px 20px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.pnav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--bg2); padding: 8px 6px 12px; }
.pnav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px 0; letter-spacing: 0.02em; }
.pnav button svg { width: 24px; height: 24px; }
.pnav button[aria-current="true"] { color: var(--lime); }
.pnav .bdg { position: absolute; margin: -4px 0 0 18px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 11px; line-height: 16px; text-align: center; }
.ptoast { position: absolute; left: 14px; right: 14px; top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--lime); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; gap: 10px; align-items: center; font-size: 14px; transform: translateY(-140%); transition: transform 0.35s ease; z-index: 5; }
.ptoast.on { transform: none; }
.ptoast b { display: block; }

.logo { display: flex; align-items: center; gap: 10px; }
.logo img { width: 30px; height: 30px; border-radius: 8px; }
.logo span { font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: 0.1em; }
.logo span i { font-style: normal; color: var(--lime); }
.hello { margin-top: 22px; font-family: var(--f-disp); font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; }
.hello small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 8px; }
.todo { margin-top: 20px; width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; border: 1px solid rgba(255, 90, 106, 0.5); background: linear-gradient(135deg, rgba(255, 90, 106, 0.2), rgba(255, 90, 106, 0.05)); }
.todo.none { border-color: var(--line); background: var(--bg2); }
.todo .n { font-family: var(--f-disp); font-weight: 800; font-size: 46px; line-height: 0.9; color: var(--red); min-width: 34px; text-align: center; }
.todo.none .n { color: var(--ok); }
.todo b { font-family: var(--f-disp); font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
.todo span { color: var(--muted); font-size: 14px; }
.todo svg { margin-left: auto; width: 20px; height: 20px; color: var(--muted); flex: none; }
.sec { margin-top: 26px; font-family: var(--f-disp); font-weight: 700; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cy); }
.list { display: grid; gap: 10px; margin-top: 12px; }
.vrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); }
.vrow:hover { border-color: var(--cy); }
.thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden; background: #0a2a45; }
.thumb svg.c { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb .pl { position: absolute; inset: 0; display: grid; place-items: center; }
.thumb .pl i { width: 26px; height: 26px; border-radius: 50%; background: rgba(5, 15, 31, 0.7); display: grid; place-items: center; }
.thumb .pl svg { width: 12px; height: 12px; color: var(--lime); margin-left: 2px; }
.vrow h4 { font-family: var(--f-disp); font-size: 21px; font-weight: 700; text-transform: uppercase; line-height: 1.05; }
.vrow .m { color: var(--muted); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.vrow .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill svg { width: 12px; height: 12px; }
.pill.new { color: var(--red); border-color: rgba(255, 90, 106, 0.5); }
.pill.seen { color: var(--ok); border-color: rgba(61, 220, 132, 0.45); }
.pill.rev { color: var(--blue); border-color: rgba(90, 169, 255, 0.5); }
.pill.imp { color: var(--gold); border-color: rgba(255, 201, 64, 0.5); }
.pill.dur { color: var(--muted); }
.ptitle { font-family: var(--f-disp); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); font-size: 14px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); border-color: transparent; }
.empty { margin-top: 24px; padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* dettaglio video */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-weight: 600; padding: 4px 0; }
.back svg { width: 18px; height: 18px; }
.player { position: relative; margin-top: 10px; border-radius: 14px; overflow: hidden; background: #08223b; border: 1px solid var(--line); }
.player svg.court { display: block; width: 100%; height: auto; }
.player .big { position: absolute; inset: 0 0 38px 0; display: grid; place-items: center; background: transparent; border: 0; }
.player .big i { width: 58px; height: 58px; border-radius: 50%; background: rgba(5, 15, 31, 0.72); border: 1px solid var(--lime); display: grid; place-items: center; }
.player .big svg { width: 24px; height: 24px; color: var(--lime); margin-left: 3px; }
.player .big.hid { opacity: 0; pointer-events: none; }
.ctl { display: flex; align-items: center; gap: 10px; padding: 6px 12px 8px; background: rgba(5, 15, 31, 0.85); }
.ctl button { background: none; border: 0; padding: 0; width: 26px; height: 26px; color: var(--lime); }
.ctl button svg { width: 24px; height: 24px; }
.ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--lime); }
.ctl time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.meta { margin-top: 14px; }
.meta .m { color: var(--muted); font-size: 15px; margin-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.tags span { padding: 3px 11px; border-radius: 6px; background: rgba(34, 211, 238, 0.12); color: var(--cy); font-size: 14px; font-weight: 600; }
.note { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--bg2); border-left: 3px solid var(--lime); }
.note h5 { margin: 0 0 6px; font-family: var(--f-disp); font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); font-weight: 700; }
.note p { font-size: 17px; }
.note.empty-n p { color: var(--muted); font-size: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); padding: 12px 18px; font-weight: 600; }
.btn:hover { border-color: var(--cy); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-lime { background: linear-gradient(180deg, var(--lime), var(--lime-d)); color: var(--on-lime); border-color: transparent; box-shadow: 0 0 26px rgba(139, 252, 3, 0.25); font-weight: 700; letter-spacing: 0.02em; }
.btn-lime:hover { border-color: transparent; filter: brightness(1.07); }
.btn.wide { width: 100%; padding: 15px 18px; font-size: 17px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.seenbox { margin-top: 18px; padding: 14px; border-radius: 14px; border: 1px solid rgba(61, 220, 132, 0.45); background: rgba(61, 220, 132, 0.08); display: flex; align-items: center; gap: 12px; }
.seenbox svg { width: 26px; height: 26px; color: var(--ok); flex: none; }
.seenbox b { display: block; }
.seenbox span { color: var(--muted); font-size: 14px; }
.btn.on { border-color: var(--gold); color: var(--gold); }

/* login e profilo */
.login h2 { font-family: var(--f-disp); font-weight: 800; font-size: 44px; text-transform: uppercase; line-height: 0.95; margin-top: 46px; }
.login p.s { color: var(--muted); margin-top: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 22px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 9px; border-radius: 9px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--fg); }
.fld { display: grid; gap: 6px; margin-top: 14px; }
.fld label { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.fld input, .fld textarea { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.fld input:focus, .fld textarea:focus { border-color: var(--cy); outline: none; }
.err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 20px; }
.demo { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.demo .chips { margin-top: 10px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--panel2), var(--panel)); border: 2px solid var(--lime); font-family: var(--f-disp); font-weight: 800; font-size: 34px; }
.prof { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
.prof h2 { font-family: var(--f-disp); font-weight: 800; font-size: 32px; text-transform: uppercase; line-height: 1; }
.prof p { color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 22px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats div { background: var(--bg2); padding: 14px 8px; text-align: center; }
.stats b { display: block; font-family: var(--f-disp); font-size: 38px; line-height: 1; font-weight: 800; }
.stats span { color: var(--muted); font-size: 13px; }
.stats .g b { color: var(--ok); } .stats .r b { color: var(--red); }
.kv { margin-top: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 15px; }
.kv b { color: var(--fg); font-weight: 600; }
.priv { margin-top: 18px; font-size: 14px; color: var(--muted); padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); }

/* area coach */
.coachcol { display: grid; gap: 18px; }
.cbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cbar h2 { font-family: var(--f-disp); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; }
.cbar .tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-disp); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cy); font-size: 14px; }
.cbar .tag::before { content: ""; width: 24px; height: 2px; background: var(--cy); }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 20px; }
.card h3 { font-family: var(--f-disp); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; }
.card .hint { color: var(--muted); font-size: 14px; margin-top: 4px; }
.act { display: grid; gap: 4px; margin-top: 14px; }
.arow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
.arow:hover { background: rgba(255, 255, 255, 0.03); }
.arow[aria-current="true"] { border-color: var(--lime); background: rgba(139, 252, 3, 0.05); }
.arow b { font-weight: 600; display: block; }
.arow small { color: var(--muted); font-size: 13px; }
.bar { height: 9px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cy), var(--lime)); border-radius: 5px; }
.arow .pc { font-family: var(--f-disp); font-size: 22px; font-weight: 700; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .arow { grid-template-columns: minmax(0, 1fr) auto; } .arow .barw { grid-column: 1 / -1; order: 3; } }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.sum div { padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.sum b { font-family: var(--f-disp); font-size: 34px; line-height: 1; display: block; font-weight: 800; }
.sum span { font-size: 13px; color: var(--muted); }
.sum .g b { color: var(--ok); } .sum .r b { color: var(--red); }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.crow:first-child { border-top: 0; }
.crow .t { min-width: 0; }
.crow .t b { font-weight: 600; }
.crow .t small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.crow .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.form { display: grid; gap: 4px; margin-top: 12px; }
.chk { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.chk input { accent-color: var(--lime); width: 18px; height: 18px; flex: none; }
.chk small { color: var(--muted); margin-left: auto; font-size: 13px; text-align: right; }
.chk.on { border-color: var(--lime); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.flab { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.fact { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.ctoast { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--lime); background: rgba(139, 252, 3, 0.08); }
.ctoast[hidden] { display: none; }
.shared { margin-top: 12px; display: grid; gap: 0; }
@media (prefers-reduced-motion: reduce) { .ptoast { transition: none; } }

/* ---- REVOS Player: a tutto schermo sul telefono ---- */
html, body { height: 100%; }
body { padding: 0; }
.app { position: relative; max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 560px) { html, body { height: 100%; overflow: hidden; } body { padding-block: 16px; } .app { height: min(860px, calc(100dvh - 32px)); border: 1px solid rgba(160,210,255,.28); border-radius: 28px; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(0,0,0,.85); } }

const logoHtml = '<div class="logo"><span class="mk"></span><span>REVOS <i>PLAYER</i></span></div>';

function home() {
  const m = sorted(), n = toWatch(m).length, first = ((S.profile && S.profile.name) || '').split(' ')[0] || '';
  return logoHtml + '<h2 class="hello">Ciao ' + esc(first) + '<small>' + (n ? 'Il tuo allenatore ha preparato dei video per te.' : (m.length ? 'Hai visto tutto. Ottimo lavoro.' : 'Quando il tuo allenatore ti assegna un video lo trovi qui.')) + '</small></h2>' +

}
function videos() {
  const m = sorted(), f = S.filter;
  const l = f === 'new' ? toWatch(m) : f === 'seen' ? m.filter((a) => a.status === 'seen') : m;
  const C = (k, t) => '<button data-act="filter" data-f="' + k + '" aria-pressed="' + (f === k) + '">' + t + '</button>';
  return '<h2 class="ptitle">I miei video</h2><div class="chips">' + C('all', 'Tutti ' + m.length) + C('new', 'Da vedere ' + toWatch(m).length) + C('seen', 'Visti ' + m.filter((a) => a.status === 'seen').length) + '</div>' +
    (l.length ? '<div class="list">' + l.map(vrow).join('') + '</div>' : '<div class="empty">Nessun video in questa lista.</div>');
}
function favs() {
  const l = sorted().filter((a) => a.important || a.favorite);
  return '<h2 class="ptitle">Preferiti</h2><p class="m" style="color:var(--muted);margin-top:8px">I video importanti e quelli che hai salvato.</p>' +
    (l.length ? '<div class="list">' + l.map(vrow).join('') + '</div>' : '<div class="empty">Tocca la stella dentro un video per salvarlo qui.</div>');
}
function profile() {
  const p = S.profile || {}, m = S.list, seen = m.filter((a) => a.status === 'seen').length;
  const last = m.map((a) => dt(a.viewedAt)).filter(Boolean).sort((x, y) => y - x)[0];
  return logoHtml + '<div class="prof"><div class="avatar">' + esc((p.name || '?').split(' ').map((x) => x[0]).join('').slice(0, 2)) + '</div><div><h2>' + esc(p.name || '') + '</h2><p>' + esc((S.team && S.team.name) || '') + (p.number ? ' · Numero ' + esc(p.number) : '') + '</p></div></div>' +
    '<div class="stats"><div><b>' + m.length + '</b><span>Assegnati</span></div><div class="g"><b>' + seen + '</b><span>Visti</span></div><div class="r"><b>' + (m.length - seen) + '</b><span>Da vedere</span></div></div>' +
    '<div class="kv"><span>Ultima visualizzazione</span><b>' + (last ? fmtDT(last) : 'nessuna') + '</b></div>' +
    notifBox() +
    '<div id="pwBox" style="margin-top:14px"><button class="btn wide" data-act="pw">Cambia password</button></div>' +
    '<p class="priv">Vedi solo i video che il tuo allenatore ha assegnato a te. Nessun altro giocatore vede i tuoi.</p>' +
    '<div id="rvlang" style="margin-top:18px"></div>' +
    '<button class="btn wide" style="margin-top:18px" data-act="logout">' + ICO.out + 'Esci</button>';
}
function notifBox() {
  const perm = typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
  let body;
  if (perm === 'unsupported') body = '<span>Per ricevere gli avvisi, aggiungi REVOS Player alla schermata Home e aprilo da lì.</span>';
  else if (perm === 'denied') body = '<span>Le notifiche sono bloccate. Attivale dalle impostazioni del telefono per REVOS Player.</span>';
  else if (perm === 'granted' && S.notifOn) body = '<span>Notifiche attive su questo telefono.</span>';
  else body = '<span>Ricevi un avviso quando il tuo allenatore ti assegna un video.</span><button class="btn wide" style="margin-top:10px" data-act="notif">Attiva notifiche</button>';
  return '<div class="priv" style="border-style:solid">' + body + (S.notifMsg ? '<br><small>' + esc(S.notifMsg) + '</small>' : '') + '</div>';
}
function apriCambioPassword() {
  const box = $('#pwBox'); if (!box) return;
  box.innerHTML = '<form id="pwf" class="priv" style="border-style:solid"><div class="fld" style="margin-top:0"><label for="pwOld">Password attuale</label><input id="pwOld" type="password" autocomplete="current-password" required></div>' +
    '<div class="fld"><label for="pwNew">Nuova password (min. 6)</label><input id="pwNew" type="password" autocomplete="new-password" minlength="6" required></div>' +
    '<div class="fld"><label for="pwNew2">Ripeti la nuova password</label><input id="pwNew2" type="password" autocomplete="new-password" minlength="6" required></div>' +
    '<p class="err" id="pwErr" role="alert"></p><p class="okm" id="pwOk"></p>' +
    '<button class="btn btn-lime wide" type="submit" id="pwBtn" style="margin-top:12px">Salva password</button></form>';
  $('#pwOld').focus();
  $('#pwf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#pwErr'), ok = $('#pwOk'), btn = $('#pwBtn'); err.textContent = ''; ok.textContent = '';
    const oldP = $('#pwOld').value, n1 = $('#pwNew').value, n2 = $('#pwNew2').value;
    if (n1.length < 6) { err.textContent = 'La nuova password deve avere almeno 6 caratteri.'; return; }
    if (n1 !== n2) { err.textContent = 'Le due password nuove non coincidono.'; return; }
    if (n1 === oldP) { err.textContent = 'La nuova password è uguale a quella attuale.'; return; }
    btn.disabled = true;
    try {
      const u = auth.currentUser;
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, oldP));
      await updatePassword(u, n1);
      ok.textContent = 'Password cambiata. Da ora usa quella nuova.';
      $('#pwf').reset();
    } catch (er) {
      const c = er && er.code;
      err.textContent = (c === 'auth/wrong-password' || c === 'auth/invalid-credential') ? 'La password attuale non è corretta.'
        : c === 'auth/weak-password' ? 'La nuova password è troppo debole.'
        : c === 'auth/too-many-requests' ? 'Troppi tentativi. Riprova tra qualche minuto.'
        : 'Non riesco a cambiarla. Riprova.';
    }
    btn.disabled = false;
  });
}
async function attivaNotifiche() {
  S.notifMsg = '';
  try {
    if (!(await isSupported())) throw new Error('Questo browser non supporta le notifiche.');
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('Permesso non concesso.');
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(app), { vapidKey: VAPID, serviceWorkerRegistration: reg });
    if (!token) throw new Error('Nessun token ricevuto.');
    await updateDoc(doc(db, 'users', S.user), { fcmTokens: arrayUnion(token) });
    S.notifOn = true;
  } catch (e) { S.notifMsg = 'Non riesco ad attivarle: ' + (e && e.message ? e.message : e); }
  render();
}
function detail() {
  const a = byId(S.detail);

  const seenBox = a.status === 'seen'
    ? '<div class="seenbox">' + ICO.check + '<div><b>Visto</b><span>' + fmtDT(a.viewedAt) + '</span></div></div><div class="row2"><button class="btn" data-act="review">' + ICO.redo + 'Da rivedere</button><button class="btn' + (a.favorite ? ' on' : '') + '" data-act="fav">' + (a.favorite ? ICO.star : ICO.starO) + 'Preferito</button></div>'
    : '<button class="btn btn-lime wide" style="margin-top:18px" data-act="seen">' + ICO.check + 'Segna come visto</button><div class="row2"><button class="btn" data-act="review">' + ICO.redo + (a.status === 'review' ? 'Già da rivedere' : 'Da rivedere') + '</button><button class="btn' + (a.favorite ? ' on' : '') + '" data-act="fav">' + (a.favorite ? ICO.star : ICO.starO) + 'Preferito</button></div>';
  const player = S.videoUrl
    ? '<video id="vp" class="vid" src="' + esc(S.videoUrl) + '" controls playsinline preload="metadata"></video>'
    : '<div class="vid ph">' + (S.videoErr ? esc(S.videoErr) : 'Carico il video…') + '</div>';
  return '<button class="back" data-act="back">' + ICO.back + 'Indietro</button><div class="player">' + player + '</div>' +
    '<div class="meta"><h2 class="ptitle">' + esc(a.title) + '</h2><p class="m">' + esc(a.match || '') + (a.matchDate ? ' · ' + esc(a.matchDate.split('-').reverse().join('/')) : '') + ' · ' + Math.round(a.durationSec || 0) + ' sec</p>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' + pill(a) + '</div><div class="tags">' + (a.tags || []).map((t) => '<span>' + esc(t) + '</span>').join('') + '</div></div>' +
    (a.note ? '<div class="note"><h5>Note dell’allenatore</h5><p>“' + esc(a.note) + '”</p></div>' : '<div class="note empty-n"><h5>Note dell’allenatore</h5><p>Nessuna nota per questo video.</p></div>') + seenBox;
}
function renderNav() {
  const nav = $('#nav');
  if (!S.user) { nav.hidden = true; return; }
  nav.hidden = false;
  const n = toWatch(S.list).length;
  const N = (k, t, ic, bd) => '<button data-act="tab" data-k="' + k + '" aria-current="' + (!S.detail && S.tab === k) + '">' + ic + (bd ? '<span class="bdg">' + bd + '</span>' : '') + t + '</button>';
  nav.innerHTML = N('home', 'Home', ICO.home) + N('video', 'Video', ICO.video, n || '') + N('fav', 'Preferiti', ICO.starO) + N('me', 'Profilo', ICO.user);
}
function render(keepScroll) {
  const scr = $('#screen'), top = scr.scrollTop, vp0 = $('#vp'), ct = vp0 ? vp0.currentTime : 0, was = !!(vp0 && !vp0.paused);
  if (S.loading) scr.innerHTML = '<div class="splash">' + logoHtml + '</div>';
  else if (!S.user) scr.innerHTML = login();
  else if (S.detail) scr.innerHTML = detail();
  else scr.innerHTML = S.tab === 'home' ? home() : S.tab === 'video' ? videos() : S.tab === 'fav' ? favs() : profile();
  scr.scrollTop = keepScroll ? top : 0;
  const vp1 = $('#vp');
  if (vp1 && vp0 && keepScroll && vp0.getAttribute('src') === vp1.getAttribute('src')) { vp1.currentTime = ct; if (was) vp1.play().catch(() => {}); }
  renderNav();
}

async function openDetail(id) {
  S.detail = id; S.videoUrl = null; S.videoErr = ''; render();
  const a = byId(id);
  try {
    const url = await getDownloadURL(ref(storage, a.storagePath));
    if (S.detail === id) { S.videoUrl = url; render(true); }
  } catch (e) {
    if (S.detail === id) { S.videoErr = 'Non riesco a caricare il video. Controlla la connessione e riprova.'; render(true); }
  }
}
async function setAssign(id, data) {
  try { await updateDoc(doc(db, 'assignments', id), data); }
  catch (e) { toast('Non sono riuscito a salvare', 'Controlla la connessione e riprova.'); }
}
let toastT = 0;
function toast(title, sub) {
  const el = $('#ptoast'); el.innerHTML = '<div><b>' + esc(title) + '</b>' + esc(sub || '') + '</div>'; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3800);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'tab') { S.tab = el.dataset.k; S.detail = null; if (S.tab === 'video') S.filter = 'all'; render(); }
  else if (act === 'towatch') { S.tab = 'video'; S.filter = 'new'; render(); }
  else if (act === 'filter') { S.filter = el.dataset.f; render(); }
  else if (act === 'open') openDetail(id);
  else if (act === 'back') { S.detail = null; render(); }
  else if (act === 'seen') { const a = byId(S.detail); await setAssign(a.id, { status: 'seen', viewedAt: serverTimestamp() }); }
  else if (act === 'review') { const a = byId(S.detail); await setAssign(a.id, { status: 'review' }); }
  else if (act === 'fav') { const a = byId(S.detail); await setAssign(a.id, { favorite: !a.favorite }); }
  else if (act === 'logout') { await signOut(auth); }
  else if (act === 'notif') { attivaNotifiche(); }
  else if (act === 'pw') { apriCambioPassword(); }
  else if (act === 'reset') {
    const em = ($('#lgEmail') || {}).value;
    if (!em) { S.err = 'Scrivi la tua email, poi tocca di nuovo “Password dimenticata?”.'; S.info = ''; render(); return; }
    try { await sendPasswordResetEmail(auth, em.trim()); S.err = ''; S.info = 'Ti ho mandato un’email per scegliere una nuova password.'; }
    catch (err) { S.err = 'Non riesco a mandare l’email. Controlla l’indirizzo.'; S.info = ''; }
    render(); const i = $('#lgEmail'); if (i) i.value = em;
  }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'lg') return;
  e.preventDefault();
  const em = $('#lgEmail').value.trim(), pw = $('#lgPass').value, btn = $('#lgBtn');
  btn.disabled = true; btn.textContent = 'Accesso…';
  try { await signInWithEmailAndPassword(auth, em, pw); S.err = ''; S.info = ''; }
  catch (err) {
    S.err = /network/.test(err.code || '') ? 'Nessuna connessione. Riprova.' : 'Email o password non corrette.'; S.info = '';
    render(); $('#lgEmail').value = em;
  }
});

onAuthStateChanged(auth, async (u) => {
  if (unsub) { unsub(); unsub = null; }
  S.list = []; S.detail = null; S.tab = 'home'; S.profile = null; S.team = null; S.loaded = false;
  if (!u) { S.user = null; S.loading = false; render(); return; }
  S.user = u.uid; S.loading = true; render();
  try {
    const p = await getDoc(doc(db, 'users', u.uid));
    S.profile = p.exists() ? p.data() : { name: u.email };
    if (S.profile.teamId) { try { const t = await getDoc(doc(db, 'teams', S.profile.teamId)); S.team = t.exists() ? t.data() : null; } catch (e) {} }
  } catch (e) { S.profile = { name: u.email }; }
  S.loading = false; render();
  const first = { v: true };
  unsub = onSnapshot(query(collection(db, 'assignments'), where('playerId', '==', u.uid)), (snap) => {
    const prev = S.list.map((a) => a.id);
    S.list = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    S.loaded = true;
    if (!first.v) {
      const nuovi = S.list.filter((a) => prev.indexOf(a.id) < 0);
      if (nuovi.length) toast('Nuovo video dal tuo allenatore', nuovi.length > 1 ? nuovi.length + ' video da vedere' : nuovi[0].title);
    }
    first.v = false;
    render(true);
  }, (err) => { toast('Non riesco a leggere i video', 'Riprova tra poco.'); });
});
render();

</script>
