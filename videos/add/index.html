<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>REVOS – aggiungi video</title>
<style>:root{color-scheme:dark}body{background:#050F1F;color:#eef3ff;font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px 20px}main{max-width:820px;margin:auto}
h1{font-size:26px;margin:0 0 6px}p.s{color:#94a3c8;margin:0 0 22px}label{display:block;margin:16px 0 6px;font-weight:600}
input,select,textarea{width:100%;box-sizing:border-box;background:#0b1d3a;color:#eef3ff;border:1px solid rgba(120,190,255,.25);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:70px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 220px}.cb{display:flex;flex-wrap:wrap;gap:6px 16px}.cb label{display:flex;gap:6px;margin:0;font-weight:400;align-items:center}.cb input{width:auto}
details{margin-top:16px;border:1px solid rgba(120,190,255,.2);border-radius:8px;padding:10px 12px}summary{cursor:pointer;font-weight:600}
button{margin-top:22px;background:#8bfc03;color:#04220f;border:0;border-radius:9px;padding:12px 22px;font:700 16px system-ui;cursor:pointer}pre{background:#02070f;border:1px solid rgba(139,252,3,.3);border-radius:8px;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word}
</style><main><h1>Aggiungi un video a REVOS</h1><p class="s">Compila, premi “Genera”, copia il blocco e incollalo nell’elenco <b>videos</b> del file <code>videos/videos.js</code> (separato da virgola dagli altri). Poi commit e push: la pagina si aggiorna da sola.</p>
<label>Link YouTube</label><input id="yt" placeholder="https://www.youtube.com/watch?v=...">
<div class="row"><div><label>Categoria</label><select id="cat"></select></div><div><label>Durata mostrata (es. 1:30)</label><input id="len"></div></div>
<label>Sport</label><div class="cb" id="sp"></div>
<div class="row"><div><label>Data di caricamento (AAAA-MM-GG)</label><input id="date" placeholder="2026-11-06"></div><div><label>Durata ISO (es. PT1M30S)</label><input id="dur" placeholder="PT59S"></div></div>
<label>Immagine di anteprima personalizzata (opzionale, es. /videos/thumbs/nome.jpg)</label><input id="thumb">
<div id="tr"></div><button id="go" type="button">Genera</button><pre id="out" hidden></pre></main>
<script src="/videos/videos.js"></script><script>
var D=window.REVOS_VIDEOS,LN={it:'Italiano',en:'English (obbligatorio)',es:'Español',fr:'Français',de:'Deutsch',pt:'Português',hr:'Hrvatski',pl:'Polski'};
document.getElementById('cat').innerHTML=D.categories.map(function(c){return '<option value="'+c.id+'">'+c.name.it+'</option>'}).join('');
document.getElementById('sp').innerHTML='<label><input type="checkbox" value="all">Tutti gli sport</label>'+D.sports.map(function(s){return '<label><input type="checkbox" value="'+s.id+'">'+s.name.it+'</label>'}).join('');
document.getElementById('tr').innerHTML=Object.keys(LN).map(function(l,i){return '<details'+(i<2?' open':'')+'><summary>'+LN[l]+'</summary><label>Titolo</label><input data-t="'+l+'"><label>Descrizione</label><textarea data-d="'+l+'"></textarea><label>Trascrizione o sottotitoli (opzionale)</label><textarea data-x="'+l+'"></textarea></details>'}).join('');
document.getElementById('go').onclick=function(){
 var m=/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/.exec(document.getElementById('yt').value),id=m?m[1]:document.getElementById('yt').value.trim();
 var v={id:id,youtube:id,category:document.getElementById('cat').value,sports:[].map.call(document.querySelectorAll('#sp input:checked'),function(x){return x.value}),title:{},description:{}};
 if(!v.sports.length)v.sports=['all'];
 [['len','length'],['date','uploadDate'],['dur','duration'],['thumb','thumbnail']].forEach(function(p){var x=document.getElementById(p[0]).value.trim();if(x)v[p[1]]=x});
 document.querySelectorAll('[data-t]').forEach(function(i){if(i.value.trim())v.title[i.dataset.t]=i.value.trim()});
 document.querySelectorAll('[data-d]').forEach(function(i){if(i.value.trim())v.description[i.dataset.d]=i.value.trim()});
 v.transcript={};document.querySelectorAll('[data-x]').forEach(function(i){if(i.value.trim())v.transcript[i.dataset.x]=i.value.trim()});if(!Object.keys(v.transcript).length)delete v.transcript;
 var o=document.getElementById('out');o.hidden=false;o.textContent=(v.title.en?'':'/* ATTENZIONE: manca il titolo in inglese */\n')+JSON.stringify(v,null,2)+',';
};
</script></html>
